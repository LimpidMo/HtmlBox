<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - HtmlBox</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/assets/theme.css">
    <script src="/assets/common.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .input-line {
            border: none;
            border-bottom: 2px solid var(--text-primary);
            background: transparent;
            outline: none;
        }
        .input-line:focus { border-color: var(--color-accent); }
        .btn-primary {
            background: var(--text-primary);
            color: var(--bg-primary);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: var(--color-accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }
        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .shake { animation: shake 0.5s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .password-wrapper { position: relative; }
        .password-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            padding: 8px;
            color: var(--text-secondary);
        }
        .password-toggle:hover { color: var(--text-primary); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full fade-in">
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold tracking-tight mb-2">HtmlBox</h1>
            <p class="font-mono text-sm" style="color: var(--text-secondary);">网页盒子</p>
        </div>

        <form id="loginForm" class="space-y-8">
            <div class="password-wrapper">
                <input
                    type="password"
                    name="password"
                    id="passwordInput"
                    placeholder="输入管理密码"
                    class="input-line w-full py-3 text-xl text-center"
                    required
                >
                <button type="button" id="togglePassword" class="password-toggle">
                    <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                    <svg id="eyeOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                    </svg>
                </button>
            </div>
            <button
                type="submit"
                class="btn-primary w-full py-4 text-lg font-mono uppercase tracking-widest"
            >
                进入
            </button>
        </form>

        <div id="error" class="hidden mt-6 text-center text-red-600 font-mono text-sm"></div>

        <div class="mt-12 text-center">
            <a href="/" class="font-mono text-xs transition-colors" style="color: var(--text-secondary);">
                ← 返回首页
            </a>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('passwordInput');
        const toggleBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        toggleBtn.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        });

        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = new FormData(form).get('password');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    // 跳回来源页（?next=），仅接受站内相对路径防开放重定向
                    const next = new URLSearchParams(location.search).get('next');
                    window.location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/admin.html';
                } else {
                    errorEl.textContent = data.error;
                    errorEl.classList.remove('hidden');
                    form.classList.add('shake');
                    setTimeout(() => form.classList.remove('shake'), 500);
                }
            } catch (err) {
                errorEl.textContent = '网络错误';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
